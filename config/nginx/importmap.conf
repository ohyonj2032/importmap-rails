# ============================================================
# Nginx 配置：importmap.json 与 Propshaft 编译产物
# 缓存生命周期强绑定，杜绝 Safari 因读取旧 Importmap
# 引发的 SRI 校验失败
# ============================================================

upstream rails_app {
  server 127.0.0.1:3000 fail_timeout=0;
}

server {
  listen 443 ssl http2;
  server_name example.com;

  ssl_certificate     /etc/nginx/ssl/cert.pem;
  ssl_certificate_key /etc/nginx/ssl/key.pem;

  root /app/public;

  # ----------------------------------------------------------
  # 核心策略：importmap.json 与指纹化资产共享缓存版本号
  # 通过部署 ID (DEPLOY_ID) 环境变量注入，每次部署递增
  # ----------------------------------------------------------

  # 1. Propshaft 指纹化资产：永久缓存
  #    路径格式：/assets/application-<digest>.js
  #    文件名中包含内容哈希，内容变化 → 文件名变化 → 天然缓存失效
  location ~ ^/assets/.+-[a-f0-9]{8,64}\.(js|css|js\.map|css\.map)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";

    # SRI 需要 CORS 头（跨域场景下 modulepreload 校验）
    add_header Access-Control-Allow-Origin "https://example.com";

    try_files $uri =404;
  }

  # 2. importmap.json：短缓存 + 部署版本绑定
  #    关键：Safari 15 的 es-module-shims 会缓存 importmap，
  #    必须确保与 JS 模块同步更新
  location = /importmap.json {
    # 不缓存 importmap.json，每次部署后立即生效
    # 或者使用极短缓存 + stale-while-revalidate
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";

    # 部署版本标记：ETag 基于文件内容
    etag on;

    # Vary: 确保不同 Accept-Encoding 得到不同缓存版本
    add_header Vary "Accept-Encoding";

    # CORS：与指纹化资产保持一致
    add_header Access-Control-Allow-Origin "https://example.com";

    try_files $uri @rails_fallback;
  }

  # 3. 非 Propshaft 指纹化的 JS/CSS：禁止缓存
  #    防止旧版模块被 CDN 边缘节点缓存
  location ~ ^/assets/.*\.(js|css)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    etag on;

    try_files $uri =404;
  }

  # 4. vendor/javascript 下的 CDN vendor 文件
  #    这些文件已通过 importmap:vendor_cdn 锁存，内容稳定
  location ~ ^/vendor/javascript/.+\.(js)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Access-Control-Allow-Origin "https://example.com";

    try_files $uri =404;
  }

  # ----------------------------------------------------------
  # HTML 页面：必须与 importmap.json 同步刷新
  # HTML 中内嵌了 importmap，若 HTML 被缓存而 importmap
  # 更新，会导致 SRI 不匹配
  # ----------------------------------------------------------
  location / {
    # HTML 不缓存，确保每次请求都获取最新的内联 importmap
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";

    # 部署标记：通过 Last-Modified 和 ETag 追踪
    etag on;
    add_header X-Deploy-ID "${DEPLOY_ID}";

    try_files $uri @rails_fallback;
  }

  # ----------------------------------------------------------
  # Rails 回退：动态请求转发到 Puma
  # ----------------------------------------------------------
  location @rails_fallback {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 传递部署 ID 给 Rails，用于 Freshness etag
    proxy_set_header X-Deploy-ID "${DEPLOY_ID}";

    proxy_redirect off;
    proxy_pass http://rails_app;
  }

  # ----------------------------------------------------------
  # 健康检查
  # ----------------------------------------------------------
  location = /up {
    proxy_set_header Host $host;
    proxy_pass http://rails_app;
  }

  # ----------------------------------------------------------
  # 静态资产通用规则
  # ----------------------------------------------------------
  location ~ ^/(assets|packs)/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # 禁止访问隐藏文件
  location ~ /\. {
    deny all;
  }
}

# ============================================================
# 缓存清除端点（仅限内部调用）
# 部署后调用，清除 CDN 边缘节点上的旧缓存
# ============================================================
server {
  listen 127.0.0.1:8888;

  location = /purge_cache {
    # 触发 Nginx 重新加载静态文件
    # 实际生产中应配合 CDN API（如 Cloudflare / Fastly）清除缓存
    return 200 "Cache purge signal sent for DEPLOY_ID=${DEPLOY_ID}\n";
    add_header Content-Type text/plain;
  }
}
