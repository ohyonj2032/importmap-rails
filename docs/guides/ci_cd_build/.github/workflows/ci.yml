name: CI/CD Pipeline for Importmap Rails

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        bundle install --jobs 4 --retry 3

    - name: Pre-pin and download CDN dependencies (offline lock)
      run: |
        # 确保 vendor/javascript 目录存在
        mkdir -p vendor/javascript
        # 下载并锁定所有 CDN 依赖到本地
        bundle exec rails importmap:pin:all || true

    - name: Build JavaScript with esbuild
      run: npm run build

    - name: Precompile assets
      env:
        RAILS_ENV: test
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      run: |
        bundle exec rails assets:precompile

    - name: Run tests
      env:
        RAILS_ENV: test
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      run: |
        bundle exec rails db:create db:migrate
        bundle exec rails test

    - name: Upload vendor/javascript cache
      uses: actions/cache@v4
      with:
        path: vendor/javascript
        key: ${{ runner.os }}-vendor-javascript-${{ hashFiles('config/importmap.rb') }}
        restore-keys: |
          ${{ runner.os }}-vendor-javascript-

  deploy:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push production image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/importmap-rails-app:latest
          ${{ secrets.DOCKER_USERNAME }}/importmap-rails-app:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
